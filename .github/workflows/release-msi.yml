name: Build MSI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt cx_Freeze

      - name: Build MSI installer
        run: python setup.py bdist_msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: guildwars2helper-msi
          path: dist/*.msi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y || true
          gh release create latest dist/*.msi --latest --notes "Automated build for commit ${{ github.sha }}" --title "Latest Automated Build"
